version: '3.8'

# Docker Compose para desenvolvimento local
# Uso: docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: talkinghead-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: talkinghead
      POSTGRES_PASSWORD: talkinghead_dev_2024
      POSTGRES_DB: talkinghead
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkinghead"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis para futuro (Fase 2)
  # redis:
  #   image: redis:7-alpine
  #   container_name: talkinghead-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped

volumes:
  postgres_data:
  # redis_data:
