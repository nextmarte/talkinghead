[project]
name = "talkinghead-backend"
version = "0.1.0"
description = "Agente conversacional em português com TTS/STT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "openai>=1.12.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "soundfile>=0.12.1",
    "scipy>=1.12.0",
    "edge-tts>=7.0.0",
    "silero-vad>=6.2.0",
    "torch-audiomentations>=0.12.0",
    "webrtcvad>=2.0.10",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1.0,<2.5.0",
    "torchaudio>=2.1.0,<2.5.0",
    "faster-whisper>=1.0.0",
    "TTS>=0.22.0",
    "transformers>=4.36.0,<4.44.0",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.4.0",
]
