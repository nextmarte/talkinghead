[project]
name = "talkinghead-backend"
version = "0.1.0"
description = "Agente conversacional em português com TTS/STT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "openai>=1.12.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "scipy>=1.12.0",
    "edge-tts>=7.0.0",
    "silero-vad>=6.2.0",
    "torch-audiomentations>=0.12.0",
    "webrtcvad>=2.0.10",
    # RAG dependencies
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "unstructured>=0.15.0",
    "tiktoken>=0.7.0",
    "aiofiles>=24.1.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.9",
    "pydub>=0.25.1",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1.0,<2.5.0",
    "torchaudio>=2.1.0,<2.5.0",
    "faster-whisper>=1.0.0",
    "TTS>=0.22.0",
    "transformers>=4.36.0,<4.44.0",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.4.0",
]
